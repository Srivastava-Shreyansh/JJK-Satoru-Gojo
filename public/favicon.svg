<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Deep Obsidian / Midnight Black Gradient -->
    <linearGradient id="gojoBg" x1="256" y1="0" x2="256" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#080E1A" />
      <stop offset="100%" stop-color="#05070B" />
    </linearGradient>

    <!-- Outer Squircle Luminous Frame -->
    <linearGradient id="gojoRim" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#53E8FF" stop-opacity="0.32" />
      <stop offset="50%" stop-color="#00AFFF" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#53E8FF" stop-opacity="0.25" />
    </linearGradient>

    <!-- Cursed Energy Cyan to Electric Blue Gradient -->
    <linearGradient id="gojoCyanLid" x1="44" y1="256" x2="468" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00AFFF" />
      <stop offset="25%" stop-color="#53E8FF" />
      <stop offset="50%" stop-color="#A5F7FF" />
      <stop offset="75%" stop-color="#53E8FF" />
      <stop offset="100%" stop-color="#00AFFF" />
    </linearGradient>

    <!-- Six Eyes Deep Cosmic Iris Gradient -->
    <radialGradient id="gojoIris" cx="256" cy="256" r="105" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#05070B" />
      <stop offset="45%" stop-color="#005599" />
      <stop offset="75%" stop-color="#00AFFF" />
      <stop offset="100%" stop-color="#53E8FF" />
    </radialGradient>

    <!-- Ambient Core Cursed Energy Glow -->
    <radialGradient id="gojoAura" cx="256" cy="256" r="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00AFFF" stop-opacity="0.28" />
      <stop offset="55%" stop-color="#53E8FF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- 1. Obsidian Squircle Container (Universal Contrast on Light/Dark Chrome) -->
  <rect width="512" height="512" rx="118" fill="url(#gojoBg)" />
  <rect x="6" y="6" width="500" height="500" rx="112" stroke="url(#gojoRim)" stroke-width="4" />

  <!-- 2. Ambient Energy Core -->
  <circle cx="256" cy="256" r="210" fill="url(#gojoAura)" />

  <!-- 3. Six Eyes Precision Contour (Clean, bold, razor-sharp) -->
  <path d="M 46,256 C 122,136 390,136 466,256 C 390,376 122,376 46,256 Z"
        stroke="url(#gojoCyanLid)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" fill="#05070B" fill-opacity="0.75" />

  <!-- 4. Six Eyes Outer Luminous Iris -->
  <circle cx="256" cy="256" r="98" fill="url(#gojoIris)" stroke="#53E8FF" stroke-width="16" />

  <!-- 5. Six Cursed Energy Perception Axes (Rikugan Hexagonal Symmetry) -->
  <g stroke="#A5F7FF" stroke-width="6.5" stroke-linecap="round" opacity="0.9">
    <line x1="256" y1="166" x2="256" y2="182" />
    <line x1="256" y1="330" x2="256" y2="346" />
    <line x1="178" y1="211" x2="192" y2="219" />
    <line x1="320" y1="293" x2="334" y2="301" />
    <line x1="178" y1="301" x2="192" y2="293" />
    <line x1="320" y1="219" x2="334" y2="211" />
  </g>

  <!-- 6. Concentric Quantum Limitless Barrier Ring (Infinitesimal Convergence) -->
  <circle cx="256" cy="256" r="68" stroke="#53E8FF" stroke-width="6" stroke-dasharray="14 8" fill="none" opacity="0.8" />

  <!-- 7. Infinite Void Obsidian Pupil -->
  <circle cx="256" cy="256" r="42" fill="#05070B" stroke="#00AFFF" stroke-width="8" />

  <!-- 8. Celestial Singularity Spark (Pure White Brilliant Glint) -->
  <circle cx="272" cy="238" r="14.5" fill="#FFFFFF" />
  <circle cx="238" cy="274" r="6" fill="#8BF3FF" opacity="0.95" />
</svg>